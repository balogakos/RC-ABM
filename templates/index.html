<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail ABM – Configure Simulation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 520px;
            color: #fff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .card h1 {
            font-size: 1.9rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card p.subtitle {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.65);
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 1rem;
            transition: border 0.2s;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #a78bfa;
        }
        select option { background: #302b63; }
        button[type=submit] {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #7c3aed, #2563eb);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: opacity 0.2s, transform 0.1s;
        }
        button[type=submit]:hover { opacity: 0.9; transform: translateY(-1px); }
        button[type=submit]:active { transform: none; }
        #spinner {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.7);
        }
        .spinner-ring {
            display: inline-block;
            width: 36px; height: 36px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        {% if error %}
        .error-box {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.5);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #fca5a5;
        }
        {% endif %}
    </style>
</head>
<body>
    <div class="card">
        <h1>🏪 Retail ABM</h1>
        <p class="subtitle">Configure and run a retail shopping agent-based model.</p>

        {% if error %}
        <div class="error-box">⚠️ {{ error }}</div>
        {% endif %}

        <form id="simForm" method="POST" action="/run">
            <div class="form-group">
                <label>Number of Agents</label>
                <input type="number" name="num_agents" value="1000" min="1" required>
            </div>
            <div class="form-group">
                <label>% Population to Model (0.0 – 1.0)</label>
                <input type="number" name="pct_model" value="0.1" step="0.01" min="0.01" max="1.0" required>
            </div>
            <div class="form-group">
                <label>Area</label>
                <select name="area">
                    <option value="All Areas">All Areas</option>
                    <option value="North">North</option>
                    <option value="South">South</option>
                    <option value="East">East</option>
                    <option value="West">West</option>
                </select>
            </div>
            <div class="form-group">
                <label>Number of Days</label>
                <input type="number" name="days" value="30" min="1" max="365" required>
            </div>
            <button type="submit" onclick="startSim()">▶ Run Simulation</button>
        </form>

        <div id="spinner">
            <div class="spinner-ring"></div>
            Running simulation... this may take a moment.
        </div>
    </div>

    <script>
        function startSim() {
            document.querySelector('button[type=submit]').disabled = true;
            document.getElementById('spinner').style.display = 'block';
        }
    </script>
</body>
</html>
